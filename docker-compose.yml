services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos}
      POSTGRES_DB: ${POSTGRES_DB:-eventos_db}
    ports:
      - "5432:5432"
    volumes:
      - eventos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventos} -d ${POSTGRES_DB:-eventos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dentro da rede do Compose, o host do banco é o nome do serviço.
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventos}:${POSTGRES_PASSWORD:-eventos}@db:5432/${POSTGRES_DB:-eventos_db}?schema=public
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  eventos_db_data:
